substitutions:
  name: esp32-p4-display
  friendly_name: ESP32-P4 Display

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Waveshare ESP32-P4 + 5-DSI-TOUCH-A"

  # Aktivierung Backlight-Chip, Startzustand, volle Helligkeit nach Boot
  on_boot:
    priority: 600
    then:
      - lambda: |-
          uint8_t v;
          v = 0x11;
          id(bl).write_byte(0x95, v);
          v = 0x17;
          id(bl).write_byte(0x95, v);
          v = 0x00;
          id(bl).write_byte(0x96, v);

      - delay: 100ms

      - lambda: |-
          uint8_t v = 0xFF;
          id(bl).write_byte(0x96, v);


esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB

  framework:
    type: esp-idf
    version: recommended


logger:
  level: DEBUG
  logs:
    lvgl: INFO
  hardware_uart: UART0


api:


ota:
  - platform: esphome


# ESP32-C6 als Wireless Coprocessor
esp32_hosted:
  active_high: true
  variant: ESP32C6

  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18

  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "${friendly_name} Fallback"
    password: "12345678"
    ap_timeout: 90s

  reboot_timeout: 15min
  power_save_mode: LIGHT


captive_portal:


psram:
  mode: hex
  speed: 200MHz


esp_ldo:
  - channel: 3
    voltage: 2.5V


# -------------------------------------------------
# I2C Bus
# -------------------------------------------------

i2c:
  id: bus_a
  sda: GPIO7
  scl: GPIO8
  scan: true
  frequency: 400kHz


# Backlight Controller
i2c_device:
  id: bl
  i2c_id: bus_a
  address: 0x45


# -------------------------------------------------
# Backlight Steuerung
# -------------------------------------------------

number:
  - platform: template
    id: backlight_level
    name: "Backlight"

    min_value: 0
    max_value: 255
    step: 1

    initial_value: 255
    optimistic: true

    set_action:
      - lambda: |-
          id(bl).write_byte(0x96, (uint8_t)x);



# -------------------------------------------------
# GT911 Touch Controller
# -------------------------------------------------

touchscreen:
  - platform: gt911

    id: touch_screen

    i2c_id: bus_a
    address: 0x5D

    update_interval: 16ms


    # Live Touch Debug Anzeige
    on_update:
      then:

        - lvgl.label.update:
            id: lbl_touch

            text: !lambda |-
              static char buf[32];

              if (touches.size() > 0) {
                snprintf(buf, sizeof(buf),
                         "X:%d Y:%d",
                         touches[0].x,
                         touches[0].y);

                return std::string(buf);
              }

              return std::string("Touch: -");


        - lambda: |-
            if (touches.size() > 0) {

              const int x = touches[0].x;
              const int y = touches[0].y;

              ESP_LOGI("touch",
                       "points=%u x=%d y=%d",
                       (unsigned)touches.size(),
                       x,
                       y);

              lv_obj_set_pos(
                id(touch_dot),
                x - 12,
                y - 12
              );
            }



# -------------------------------------------------
# Fonts
# -------------------------------------------------

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 96

  - file: "gfonts://Roboto"
    id: font_small
    size: 32



# -------------------------------------------------
# MIPI DSI Display
# -------------------------------------------------

display:
  - platform: mipi_dsi

    id: main_display

    model: CUSTOM

    dimensions:
      width: 720
      height: 1280

    lanes: 2
    lane_bit_rate: 700Mbps


    color_order: rgb
    pixel_mode: 16bit
    color_depth: 16

    update_interval: never

    auto_clear_enabled: false

#    pclk_frequency: 60226000


    hsync_front_porch: 12
    hsync_pulse_width: 24
    hsync_back_porch: 32

    vsync_front_porch: 24
    vsync_pulse_width: 1
    vsync_back_porch: 24


    init_sequence: !include mipi_init/waveshare_5dsi_touch_a.yaml


# -------------------------------------------------
# Hintergrundbild
# -------------------------------------------------

image:
  - file: "forecasts.png"
    id: img_forecasts
    type: RGB565
    resize: 720x1280
    byte_order: little_endian


# -------------------------------------------------
# LVGL
# -------------------------------------------------

lvgl:

  byte_order: little_endian

  displays:
    - main_display

  touchscreens:
    - touch_screen

  buffer_size: 80%


  pages:

    - id: main_page

      widgets:


        # Hintergrundbild

        - image:

            id: bg_forecasts

            src: img_forecasts

            align: CENTER

            width: 720
            height: 1280



        # -------------------------------------------------
        # Backlight Touch Slider
        # -------------------------------------------------

        - obj:

            id: backlight_slider

            clickable: true

            x: 0
            y: 0

            width: 720
            height: 90

            radius: 0

            bg_color: 0x0000FF
            bg_opa: 0%

            border_width: 0
            shadow_width: 0


            on_press:
              then:

                - lambda: |-

                    lv_indev_t * indev = lv_indev_get_act();

                    if (indev != nullptr) {

                      lv_point_t point;

                      lv_indev_get_point(indev, &point);

                      int x = point.x;


                      if (x < 0) x = 0;
                      if (x > 720) x = 720;


                      uint8_t brightness =
                        255 - ((x * 230) / 720);


                      ESP_LOGI("backlight",
                               "x=%d brightness=%d",
                               x,
                               brightness);


                      id(backlight_level).publish_state(brightness);

                      id(bl).write_byte(0x96, brightness);
                    }


            on_pressing:
              then:

                - lambda: |-

                    lv_indev_t * indev = lv_indev_get_act();

                    if (indev != nullptr) {

                      lv_point_t point;

                      lv_indev_get_point(indev, &point);

                      int x = point.x;


                      if (x < 0) x = 0;
                      if (x > 720) x = 720;


                      uint8_t brightness =
                        255 - ((x * 230) / 720);


                      id(backlight_level).publish_state(brightness);

                      id(bl).write_byte(0x96, brightness);
                    }
        # -------------------------------------------------
        # Touch Koordinaten
        # -------------------------------------------------

        - label:

            id: lbl_touch

            text: "Touch: -"

            x: 10
            y: 10

            text_font: font_small

            text_color: 0xFFFFFF



        # -------------------------------------------------
        # Touch Punkt
        # -------------------------------------------------

        - obj:

            id: touch_dot

            x: 0
            y: 0

            width: 24
            height: 24

            bg_color: 0xFF0000

            bg_opa: 100%

            radius: 12

            border_width: 0

            outline_width: 0

            shadow_width: 0

            pad_all: 0
