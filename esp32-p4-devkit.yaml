substitutions:
  name: esp32-p4-display
  friendly_name: ESP32-P4 Display

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Waveshare ESP32-P4 + 5-DSI-TOUCH-A"

# Aktivierung Backlight-Chip, definiere Startzusatnd, volle Helligkeit nach boot
  on_boot:
    priority: 600
    then:
      - lambda: |-
          uint8_t v;
          v = 0x11; id(bl).write_byte(0x95, v);
          v = 0x17; id(bl).write_byte(0x95, v);
          v = 0x00; id(bl).write_byte(0x96, v);
      - delay: 100ms
      - lambda: |-
          uint8_t v = 0xFF;
          id(bl).write_byte(0x96, v);

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended

logger:
  level: DEBUG
  logs:
    lvgl: INFO
  hardware_uart: UART0

api:

ota:
  - platform: esphome

esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: "12345678"
    ap_timeout: 90s
  reboot_timeout: 15min
  power_save_mode: LIGHT

captive_portal:

psram:
  mode: hex
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

i2c:
  id: bus_a
  sda: GPIO7
  scl: GPIO8
  scan: true
  frequency: 400kHz

i2c_device:
  id: bl
  i2c_id: bus_a
  address: 0x45

number:
  - platform: template
    id: backlight_level
    name: "Backlight"
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 255
    optimistic: true
# Number Wert → I2C Register → echte LED-Helligkeit.
    set_action:
      - lambda: |-
          id(bl).write_byte(0x96, (uint8_t)x);

touchscreen:
  - platform: gt911
    id: touch_screen
    i2c_id: bus_a
    address: 0x5D
    update_interval: 16ms
# Debug-Monitor für Touch-Koordinaten, zeigt live die aktuelle Fingerposition oben links im Display an.
    on_update:
      then:
        - lvgl.label.update:
            id: lbl_touch
            text: !lambda |-
              static char buf[32];
              if (touches.size() > 0) {
                snprintf(buf, sizeof(buf), "X:%d Y:%d", touches[0].x, touches[0].y);
                return buf;
              }
              return std::string("Touch: -");

        - lambda: |-
            if (touches.size() > 0) {
              const int x = touches[0].x;
              const int y = touches[0].y;
              ESP_LOGI("touch", "points=%u x=%d y=%d", (unsigned)touches.size(), x, y);
              lv_obj_set_pos(id(touch_dot), x - 12, y - 12);
            }

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 96
  - file: "gfonts://Roboto"
    id: font_small
    size: 32

display:
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM

    dimensions:
      width: 720
      height: 1280

    lanes: 2
    # exakt berechnet: (60226000 * 16) / 2 = 481.808 MHz
    lane_bit_rate: 600Mbps

    color_order: rgb
    pixel_mode: 16bit
    color_depth: 16

    update_interval: never
    auto_clear_enabled: false

    pclk_frequency: 60226000

    hsync_front_porch: 12
    hsync_pulse_width: 24
    hsync_back_porch: 32

    vsync_front_porch: 24
    vsync_pulse_width: 1
    vsync_back_porch: 24

    init_sequence:
      - [0x11]
      - delay 120ms
      - [0x36, 0x00]
      - [0x3A, 0x55]
      - [0xBA, 0x61]
      - [0xB9, 0xFF, 0x83, 0x94]
      - [0xB1, 0x48, 0x0A, 0x6A, 0x09, 0x33, 0x54, 0x71, 0x71, 0x2E, 0x45]
      - [0xBA, 0x61, 0x03, 0x68, 0x6B, 0xB2, 0xC0]
      - [0xB2, 0x00, 0x80, 0x64, 0x0C, 0x06, 0x2F]
      - [0xB4, 0x1C, 0x78, 0x1C, 0x78, 0x1C, 0x78, 0x01, 0x0C, 0x86, 0x75, 0x00, 0x3F, 0x1C, 0x78, 0x1C, 0x78, 0x1C, 0x78, 0x01, 0x0C, 0x86]
      - [0xD3, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x08, 0x08, 0x32, 0x10, 0x05, 0x00, 0x05, 0x32, 0x13, 0xC1, 0x00, 0x01, 0x32, 0x10, 0x08, 0x00, 0x00, 0x37, 0x03, 0x07, 0x07, 0x37, 0x05, 0x05, 0x37, 0x0C, 0x40]
      - [0xD5, 0x18, 0x18, 0x18, 0x18, 0x22, 0x23, 0x20, 0x21, 0x04, 0x05, 0x06, 0x07, 0x00, 0x01, 0x02, 0x03, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x19, 0x19, 0x19, 0x19]
      - [0xD6, 0x18, 0x18, 0x19, 0x19, 0x21, 0x20, 0x23, 0x22, 0x03, 0x02, 0x01, 0x00, 0x07, 0x06, 0x05, 0x04, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x18, 0x19, 0x19, 0x18, 0x18]
      - [0xE0, 0x07, 0x08, 0x09, 0x0D, 0x10, 0x14, 0x16, 0x13, 0x24, 0x36, 0x48, 0x4A, 0x58, 0x6F, 0x76, 0x80, 0x97, 0xA5, 0xA8, 0xB5, 0xC6, 0x62, 0x63, 0x68, 0x6F, 0x72, 0x78, 0x7F, 0x7F, 0x00, 0x02, 0x08, 0x0D, 0x0C, 0x0E, 0x0F, 0x10, 0x24, 0x36, 0x48, 0x4A, 0x58, 0x6F, 0x78, 0x82, 0x99, 0xA4, 0xA0, 0xB1, 0xC0, 0x5E, 0x5E, 0x64, 0x6B, 0x6C, 0x73, 0x7F, 0x7F]
      - [0xCC, 0x0B]
      - [0xC0, 0x1F, 0x73]
