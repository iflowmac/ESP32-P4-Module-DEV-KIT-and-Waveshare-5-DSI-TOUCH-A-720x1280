      - [0xB2, 0x00, 0x80, 0x64, 0x0C, 0x06, 0x2F, 0x00, 0x00, 0x00, 0x00, 0xC0, 0x18]
      - [0x29]
      - delay 80ms

#Hintergrundbild anzeigen
image:
  - file: "forecasts.png"
    id: img_forecasts
    type: RGB565
    resize: 720x1280
    byte_order: little_endian

lvgl:
  byte_order: little_endian
  displays:
    - main_display
  touchscreens:
    - touch_screen
  buffer_size: 80%
  pages:
    - id: main_page
      widgets:

        - image:
            id: bg_forecasts
            src: img_forecasts
            align: CENTER
            width: 720
            height: 1280

        - obj:
            id: btn_dim
            clickable: true
            align: LEFT_MID
            x: 130
            width: 70
            height: 344  
            radius: 0
            bg_color: 0x0000FF
            bg_opa: 10%
            border_width: 0
            shadow_width: 0
            on_click:
              then:
                - lambda: |-
                    static bool dimmed = false;
                    dimmed = !dimmed;

                    const uint8_t v = dimmed ? 10 : 255;
                    id(backlight_level).publish_state(v);
                    id(bl).write_byte(0x96, v);

#        - label:
#            text: "LVGL OK"
#            align: center
#            text_font: font_big
#            text_color: 0xFFFFFF

        - label:
            id: lbl_touch
            text: "Touch: -"
            x: 10
            y: 10
            text_font: font_small
            text_color: 0xFFFFFF

        - obj:
            id: touch_dot
            x: 0
            y: 0
            width: 24
            height: 24
            bg_color: 0xFF0000
            bg_opa: 100%
            radius: 12
            border_width: 0
            outline_width: 0
            shadow_width: 0
            pad_all: 0
